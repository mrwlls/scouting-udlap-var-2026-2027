  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c));
  return new TextDecoder().decode(pt);
}
async function go() {
  const err = document.getElementById('err'); err.textContent = 'Abriendo…';
  try { const h = await open_(document.getElementById('pw').value); document.open(); document.write(h); document.close(); }
  catch (e) { err.textContent = 'Contraseña incorrecta.'; }
}
document.getElementById('go').addEventListener('click', go);
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
</script></body></html>
